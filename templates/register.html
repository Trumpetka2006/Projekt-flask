{% extends "core.html" %}

{% block page_title %}Registrace{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-4"></div>
        <div class="col-4">
            {% if error == 1 %}
            <div class="alert alert-danger"><strong>Chyba!</strong> Uživatelské jméno již existuje.</div>
            {% endif %}
            {% if error == 2 %}
            <div class="alert alert-danger"><strong>Chyba!</strong> Hesla se neschodují.</div>
            {% endif %}
            <h3 style="text-align: center;">Registrace</h3>
            <form action="/register" method="POST" class="border" style="padding: 2rem;">
                <div class="mb-3">
                    <label class="form-label" for="">Jméno</label>
                    <input class="form-control" type="text" name="username" id="" required minlength="3" maxlength="16">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="">Email</label>
                    <input class="form-control" type="text" name="email" id="" required minlength="3" maxlength="32">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="">Heslo</label>
                    <input class="form-control" type="password" name="password1" id="" required minlength="4" maxlength="16">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="">Potvrďte Heslo</label>
                    <input class="form-control" type="password" name="password2" id="" required minlength="4" maxlength="16">
                </div>
        
                <div class="mb-3">
                    <input class="btn btn-primary" type="submit" value="Zaregistrovat se">
                </div>
            </form>
        </div>
        <div class="col-4"></div>
    </div>
</div>




{% endblock %}
